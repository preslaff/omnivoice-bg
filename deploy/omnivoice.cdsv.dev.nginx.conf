# nginx reverse proxy for the OmniVoice-BG volunteer collector.
#
#   omnivoice.cdsv.dev  (public, HTTPS)  ->  127.0.0.1:8004  (collect.py)
#
# NOTE: the collector listens on 8004 (8003 was already taken on this VPS). If you
# move it again, change BOTH the --port in omnivoice-collect.service AND the
# proxy_pass below, then reload both units.
#
# WHY HTTPS IS MANDATORY: the recording page uses the browser MediaRecorder /
# getUserMedia API, which only works in a *secure context* (https:// or
# localhost). Over plain http:// the microphone is silently blocked, so TLS is
# not optional here.
#
# THIS FILE IS HTTP-ONLY ON PURPOSE (bootstrap). It does NOT reference any
# ssl_certificate — because the cert does not exist until certbot creates it, and
# nginx refuses to load a missing cert (nginx -t fails, and `certbot --nginx`
# runs nginx -t as a preflight, so a hard-coded cert path deadlocks the install).
# Instead, install this HTTP-only conf, then let certbot add the 443 server +
# redirect + cert paths for you:
#
# Install:
#   sudo cp deploy/omnivoice.cdsv.dev.nginx.conf /etc/nginx/sites-available/omnivoice.cdsv.dev
#   sudo ln -sf /etc/nginx/sites-available/omnivoice.cdsv.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d omnivoice.cdsv.dev      # obtains cert, injects SSL + :80->:443
#   sudo nginx -t && sudo systemctl reload nginx
#
# After certbot runs, THIS installed file is rewritten in place: a `listen 443
# ssl` server appears with the real cert paths, this location block is copied
# into it, and the block below becomes a redirect to https. DNS for the subdomain
# must resolve to this VPS and :80 be reachable, or the ACME challenge fails.

server {
    listen 80;
    listen [::]:80;
    server_name omnivoice.cdsv.dev;

    # certbot uses this path for the ACME http-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Audio uploads: short imperative clips are tiny (<1 MB), but leave headroom.
    client_max_body_size 25m;

    # Optional — gate volunteers behind a shared password (the app has NO auth):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/omnivoice.htpasswd volunteers
    # then uncomment:
    #   auth_basic           "OmniVoice volunteers";
    #   auth_basic_user_file /etc/nginx/omnivoice.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;      # app sees it's HTTPS
        proxy_read_timeout 120s;                            # allow slow uploads
    }
}
