# nginx reverse proxy for the OmniVoice-BG volunteer collector.
#
#   omnivoice.cdsv.dev  (public, HTTPS)  ->  127.0.0.1:8003  (collect.py)
#
# WHY HTTPS IS MANDATORY: the recording page uses the browser MediaRecorder /
# getUserMedia API, which only works in a *secure context* (https:// or
# localhost). Over plain http:// the microphone is silently blocked, so TLS is
# not optional here.
#
# Install:
#   sudo cp deploy/omnivoice.cdsv.dev.nginx.conf /etc/nginx/sites-available/omnivoice.cdsv.dev
#   sudo ln -s /etc/nginx/sites-available/omnivoice.cdsv.dev /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d omnivoice.cdsv.dev      # obtains the cert + wires SSL
#   sudo nginx -t && sudo systemctl reload nginx
#
# (If you run `certbot --nginx`, it fills in the ssl_certificate lines and the
#  :80 redirect automatically — you can start from just the location block.)

# --- HTTP -> HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name omnivoice.cdsv.dev;
    # certbot uses this path for the ACME http-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: proxy to the collector -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name omnivoice.cdsv.dev;

    # Filled in by `certbot --nginx` (Let's Encrypt):
    ssl_certificate     /etc/letsencrypt/live/omnivoice.cdsv.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnivoice.cdsv.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audio uploads: short imperative clips are tiny (<1 MB), but leave headroom.
    client_max_body_size 25m;

    # Optional — gate volunteers behind a shared password (the app has NO auth):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/omnivoice.htpasswd volunteers
    # then uncomment:
    #   auth_basic           "OmniVoice volunteers";
    #   auth_basic_user_file /etc/nginx/omnivoice.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;      # app sees it's HTTPS
        proxy_read_timeout 120s;                            # allow slow uploads
    }
}
